<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Validación de Arriendo - Deteco IC SA</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Excel, PDF Text Extraction & PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Firma Digital -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; touch-action: manipulation; }
        .rounded-premium { border-radius: 1rem; }
        .bg-deteco { background-color: #f37021; }
        .text-deteco { color: #f37021; }
        .border-deteco { border-color: #f37021; }
        
        /* Animación Pulse-Fade Logo */
        @keyframes pulse-fade {
            0%, 100% { opacity: 1; filter: saturate(100%); transform: scale(1); }
            50% { opacity: 0.3; filter: saturate(10%) blur(1px); transform: scale(0.95); }
        }
        .animate-logo-ai { animation: pulse-fade 2s infinite ease-in-out; }

        /* Compactación de Tabla */
        td, th { padding: 0.4rem 0.5rem !important; font-size: 0.7rem; }
        
        /* Contenedor de Firma */
        .signature-wrapper {
            border: 2px dashed #cbd5e1;
            background: #fff;
            width: 100%;
            height: 150px;
            position: relative;
        }
        canvas { width: 100%; height: 100%; cursor: crosshair; }

        @media (max-width: 640px) {
            .hide-mobile { display: none; }
            h1 { font-size: 1.25rem !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        const apiKey = "AIzaSyBE7rU55LgDSHZY2rY_W31GFDobCCcf-H0"; 
        const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";

        // Configuración de PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const App = () => {
            const [data, setData] = useState([]);
            const [filterObra, setFilterObra] = useState('Todas');
            const [searchTerm, setSearchTerm] = useState('');
            const [loadingAI, setLoadingAI] = useState(false);
            
            const [modals, setModals] = useState({ add: false, edit: false, validate: false, upload: false });
            const [form, setForm] = useState({ id: null, obra: '', nuevaObra: '', item: '', serie: '', valor: 0, dias: 1 });
            const [terrenoData, setTerrenoData] = useState({ nombre: '', periodo: 'ENERO 2026' });
            const [providerName, setProviderName] = useState('');

            const fileInputRef = useRef(null);
            const signaturePadRef = useRef(null);
            const canvasRef = useRef(null);

            useEffect(() => { 
                lucide.createIcons(); 
                if (modals.validate && canvasRef.current) {
                    signaturePadRef.current = new SignaturePad(canvasRef.current);
                }
            }, [modals.validate]);

            // --- EXTRACCIÓN DE TEXTO PDF ---
            const extractTextFromPDF = async (file) => {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    fullText += textContent.items.map(item => item.str).join(" ") + "\n";
                }
                return fullText;
            };

            // --- ANÁLISIS IA GEMINI ---
            const analyzeWithGemini = async (text, provider) => {
                setLoadingAI(true);
                const prompt = `Analiza estos datos del proveedor "${provider}" y extrae el detalle de arriendos.
                Ignora totales y saldos antiguos. Clasifica por Obra.
                Devuelve JSON: { "records": [{ "obra": "...", "item": "...", "serie": "...", "valor": 0, "dias": 0 }] }`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Texto extraído:\n${text}` }] }],
                            systemInstruction: { parts: [{ text: prompt }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const result = await response.json();
                    const aiData = JSON.parse(result.candidates[0].content.parts[0].text);
                    const formatted = aiData.records.map((r, i) => ({ ...r, id: Date.now() + i, neto: r.valor * r.dias }));
                    setData([...data, ...formatted].sort((a, b) => a.obra.localeCompare(b.obra)));
                } catch (e) { console.error("Error IA:", e); }
                finally { setLoadingAI(false); }
            };

            const handleFile = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setModals({...modals, upload: false});

                let text = "";
                if (file.type === "application/pdf") {
                    text = await extractTextFromPDF(file);
                } else {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const wb = XLSX.read(evt.target.result, { type: 'binary' });
                        text = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
                        analyzeWithGemini(text, providerName);
                    };
                    reader.readAsBinaryString(file);
                    return;
                }
                analyzeWithGemini(text, providerName);
            };

            const obrasList = useMemo(() => [...new Set(data.map(d => d.obra))].sort(), [data]);
            const filteredData = useMemo(() => data.filter(i => (filterObra === 'Todas' || i.obra === filterObra) && i.item.toLowerCase().includes(searchTerm.toLowerCase())), [data, filterObra, searchTerm]);
            const totalGeneral = filteredData.reduce((s, i) => s + i.neto, 0);

            // --- GENERAR PDF CON FIRMA ---
            const finalizeValidation = (e) => {
                e.preventDefault();
                if (signaturePadRef.current.isEmpty()) return;

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const now = new Date().toLocaleString('es-CL');
                const sigImage = signaturePadRef.current.toDataURL();

                const logo = new Image(); logo.src = 'logo.png';
                doc.addImage(logo, 'PNG', 14, 10, 25, 10);
                doc.setFont("helvetica", "bold"); doc.setFontSize(16);
                doc.text("Estado de Pago de Arriendo de Herramientas", 105, 30, { align: "center" });
                
                doc.setFontSize(8); doc.setFont("helvetica", "normal"); doc.setTextColor(100);
                doc.text(`VALIDACIÓN PROFESIONAL DE TERRENO`, 105, 36, { align: "center" });

                doc.setTextColor(30); doc.setFontSize(9);
                doc.text(`Autorizado por: ${terrenoData.nombre.toUpperCase()}`, 14, 50);
                doc.text(`Periodo: ${terrenoData.periodo}`, 14, 55);
                doc.text(`Timestamp: ${now}`, 14, 60);

                doc.autoTable({
                    startY: 68,
                    head: [['OBRA', 'DESCRIPCIÓN', 'SERIE', 'V. DÍA', 'DÍAS', 'NETO']],
                    body: filteredData.map(d => [d.obra, d.item, d.serie, `$${d.valor.toLocaleString()}`, d.dias, `$${d.neto.toLocaleString()}`]),
                    theme: 'striped', headStyles: { fillColor: [243, 112, 33], fontSize: 7 },
                    styles: { fontSize: 7, cellPadding: 1 }
                });

                const finalY = doc.lastAutoTable.finalY + 10;
                doc.setFont("helvetica", "bold");
                doc.text(`TOTAL NETO APROBADO: $${totalGeneral.toLocaleString()} CLP`, 196, finalY, { align: 'right' });

                doc.addImage(sigImage, 'PNG', 75, finalY + 15, 60, 20);
                doc.line(75, finalY + 35, 135, finalY + 35);
                doc.setFontSize(8); doc.text("FIRMA PROFESIONAL DE TERRENO", 105, finalY + 40, { align: "center" });

                doc.save(`Validacion_${filterObra}_${Date.now()}.pdf`);
                setModals({ ...modals, validate: false });
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {loadingAI && (
                        <div className="fixed inset-0 z-[100] bg-slate-900/80 backdrop-blur-md flex flex-col items-center justify-center text-white p-6">
                            <img src="logo 2.png" className="h-20 w-auto mb-6 animate-logo-ai" />
                            <h3 className="text-xl font-black uppercase tracking-tighter">IA Gemini Analizando...</h3>
                        </div>
                    )}

                    <nav className="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-40 shadow-sm flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <img src="logo.png" className="h-8 w-auto" />
                            <h1 className="text-lg font-black text-slate-800 tracking-tighter uppercase border-l pl-3 border-slate-200">Validación de Arriendo</h1>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setModals({...modals, upload: true})} className="bg-white border p-2 rounded-xl shadow-sm hover:bg-slate-50 transition-all flex items-center gap-2">
                                <img src="logo 2.png" className="h-4 w-auto" />
                                <span className="hide-mobile text-[10px] font-bold uppercase">Carga Inteligente</span>
                            </button>
                            <div className="text-right border-l pl-3 border-slate-200 hide-mobile">
                                <p className="text-xl font-black text-deteco leading-none">${totalGeneral.toLocaleString()}</p>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-6 w-full flex-1">
                        {/* BOTÓN PRINCIPAL SIMPLIFICADO */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div className="bg-white p-4 rounded-premium shadow-sm border-l-4 border-deteco flex justify-between items-center">
                                <div><p className="text-[10px] font-bold text-slate-400 uppercase">Monto Neto</p><h2 className="text-2xl font-black text-slate-800 tracking-tighter">${totalGeneral.toLocaleString()}</h2></div>
                                <div className="text-right"><p className="text-[10px] font-bold text-slate-400 uppercase">Items</p><h2 className="text-2xl font-black text-slate-800">{filteredData.length}</h2></div>
                            </div>
                            <button onClick={() => setModals({...modals, validate: true})} className="bg-deteco text-white p-4 rounded-premium shadow-lg flex items-center justify-between group active:scale-95 transition-all">
                                <span className="font-black text-sm uppercase tracking-widest">Validar Terreno</span>
                                <i data-lucide="check-circle-2" size={28}></i>
                            </button>
                        </div>

                        {/* FILTROS */}
                        <div className="flex gap-2 mb-4 overflow-x-auto pb-2 custom-scroll">
                            <div className="relative flex-1 min-w-[200px]">
                                <i data-lucide="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300" size={14}></i>
                                <input type="text" className="w-full pl-9 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl font-bold text-xs" placeholder="Buscar..." value={searchTerm} onChange={(e)=>setSearchTerm(e.target.value)} />
                            </div>
                            <select className="bg-white border rounded-xl px-4 font-black text-[10px] uppercase" value={filterObra} onChange={(e)=>setFilterObra(e.target.value)}>
                                <option value="Todas">Obras</option>
                                {obrasList.map(o => <option key={o} value={o}>{o}</option>)}
                            </select>
                            <button onClick={()=>setModals({...modals, add:true})} className="bg-slate-900 text-white p-2.5 rounded-xl"><i data-lucide="plus" size={18}></i></button>
                        </div>

                        {/* TABLA COMPACTA */}
                        <div className="bg-white rounded-xl shadow-sm border overflow-hidden mb-6">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-50 border-b text-slate-400">
                                        <tr><th className="uppercase tracking-widest text-[9px]">Obra</th><th className="uppercase tracking-widest text-[9px]">Descripción</th><th className="uppercase tracking-widest text-[9px] text-right">Neto</th><th className="text-center"></th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {filteredData.map(row => (
                                            <tr key={row.id} className="active:bg-slate-50 transition-colors">
                                                <td className="font-black text-slate-700">{row.obra}</td>
                                                <td className="text-slate-500 font-medium italic">{row.item}</td>
                                                <td className="text-right font-black text-slate-900">${row.neto.toLocaleString()}</td>
                                                <td className="text-center">
                                                    <button onClick={()=>{setForm({...row, nuevaObra:''}); setModals({...modals, edit:true})}} className="p-2 text-blue-500"><i data-lucide="edit-2" size={12}></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {/* MODAL VALIDACIÓN CON FIRMA */}
                    {modals.validate && (
                        <div className="fixed inset-0 bg-slate-900/95 z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden modal-pop">
                                <div className="p-6 bg-slate-900 text-white text-center">
                                    <h3 className="font-black text-xl uppercase tracking-tighter">Validación de Terreno</h3>
                                    <p className="text-deteco font-bold text-[10px] uppercase">Firma Digital Requerida</p>
                                </div>
                                <form onSubmit={finalizeValidation} className="p-6 space-y-4">
                                    <input type="text" className="w-full p-3 bg-slate-50 border rounded-xl font-bold text-sm" placeholder="Nombre de quien autoriza" value={terrenoData.nombre} onChange={(e)=>setTerrenoData({...terrenoData, nombre:e.target.value})} required />
                                    <input type="text" className="w-full p-3 bg-slate-50 border rounded-xl font-bold text-sm" value={terrenoData.periodo} onChange={(e)=>setTerrenoData({...terrenoData, periodo:e.target.value})} required />
                                    
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Firma en el recuadro:</label>
                                        <div className="signature-wrapper">
                                            <canvas ref={canvasRef}></canvas>
                                        </div>
                                        <button type="button" onClick={()=>signaturePadRef.current.clear()} className="text-[9px] font-bold text-slate-400 uppercase">Borrar Firma</button>
                                    </div>

                                    <button type="submit" className="w-full bg-deteco text-white p-4 rounded-xl font-black uppercase text-xs shadow-lg active:scale-95 transition-all">Firmar y Descargar</button>
                                    <button type="button" onClick={()=>setModals({...modals, validate:false})} className="w-full text-slate-400 font-bold text-[10px] uppercase">Cancelar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL UPLOAD */}
                    {modals.upload && (
                        <div className="fixed inset-0 bg-slate-900/90 glass-effect z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 modal-pop">
                                <div className="text-center mb-6">
                                    <img src="logo 2.png" className="h-12 mx-auto mb-2" />
                                    <h3 className="font-black text-lg uppercase tracking-tighter">Carga Inteligente</h3>
                                </div>
                                <input type="text" className="w-full p-3 bg-slate-50 border rounded-xl font-bold mb-4" placeholder="Nombre Proveedor (SKC, Maq...)" value={providerName} onChange={(e)=>setProviderName(e.target.value)} />
                                <button disabled={!providerName} onClick={()=>fileInputRef.current.click()} className="w-full bg-slate-900 text-white p-4 rounded-xl font-black uppercase text-xs disabled:opacity-30">Subir Excel o PDF</button>
                                <input type="file" ref={fileInputRef} onChange={handleFile} className="hidden" accept=".xlsx,.xls,.pdf" />
                                <button onClick={()=>setModals({...modals, upload:false})} className="w-full mt-4 text-slate-400 font-bold text-[10px] uppercase">Cerrar</button>
                            </div>
                        </div>
                    )}

                    {/* MODAL ADD/EDIT */}
                    {(modals.add || modals.edit) && (
                        <div className="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6">
                                <h3 className="font-black text-lg uppercase tracking-tighter mb-4">{form.id ? 'Editar' : 'Nuevo'} Item</h3>
                                <div className="space-y-3">
                                    <select className="w-full p-3 bg-slate-100 rounded-xl font-bold text-xs" value={form.obra} onChange={(e)=>setForm({...form, obra:e.target.value})} required>
                                        <option value="">Seleccionar Obra</option>
                                        {obrasList.map(o => <option key={o} value={o}>{o}</option>)}
                                        <option value="NUEVA">+ Obra Nueva</option>
                                    </select>
                                    {form.obra === 'NUEVA' && <input type="text" className="w-full p-3 bg-orange-50 border rounded-xl font-bold text-xs" placeholder="Nombre Obra" onChange={(e)=>setForm({...form, nuevaObra:e.target.value})} />}
                                    <input type="text" className="w-full p-3 bg-slate-100 rounded-xl font-bold text-xs" placeholder="Descripción" value={form.item} onChange={(e)=>setForm({...form, item:e.target.value})} />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="number" className="p-3 bg-slate-100 rounded-xl font-bold text-xs" placeholder="V. Día" value={form.valor} onChange={(e)=>setForm({...form, valor:Number(e.target.value)})} />
                                        <input type="number" className="p-3 bg-slate-100 rounded-xl font-bold text-xs" placeholder="Días" value={form.dias} onChange={(e)=>setForm({...form, dias:Number(e.target.value)})} />
                                    </div>
                                </div>
                                <button onClick={()=>{
                                    const obraFinal = form.obra === 'NUEVA' ? form.nuevaObra.toUpperCase() : form.obra;
                                    const entry = { ...form, obra: obraFinal, neto: form.valor * form.dias };
                                    if(form.id) setData(data.map(i=>i.id===form.id?entry:i));
                                    else setData([...data, {...entry, id:Date.now()}]);
                                    setModals({add:false, edit:false});
                                }} className="w-full bg-deteco text-white p-4 rounded-xl font-black uppercase text-xs mt-4">Guardar</button>
                                <button onClick={()=>setModals({add:false, edit:false})} className="w-full mt-2 text-slate-400 font-bold text-[10px] uppercase">Cancelar</button>
                            </div>
                        </div>
                    )}

                    <footer className="py-8 px-4 text-center border-t mt-auto">
                        <img src="logo.png" className="h-6 mx-auto grayscale opacity-30 mb-2" />
                        <p className="text-[10px] font-black uppercase text-slate-400 tracking-[0.4em]">Creado por Iván Vivanco • 2026</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
